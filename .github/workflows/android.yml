name: Android APK

# Builds the Android port from source on a clean Linux runner: the Rust core
# (both CPU variants, through cargo-ndk and the NDK), then the Kotlin app.
# The APK is signed with Android's debug key, which is enough to sideload it.

on:
  push:
    branches: [fr, android]
    paths:
      - "android/**"
      - "src/dictation/**"
      - "src/transcription/artifacts.rs"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "src/dictation/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"

      # The SDK's cmake package carries the ninja that build-core.sh expects on
      # PATH (CMAKE_GENERATOR=Ninja), so put it first.
      - name: Tools on PATH
        run: echo "${ANDROID_HOME}/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --console=plain

      - name: Core tests
        run: |
          cd android/core
          cargo test --release

      - uses: actions/upload-artifact@v4
        with:
          name: hex-fr-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
          if-no-files-found: error
